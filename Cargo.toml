[package]
name = "eatbe"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [".", "entity", "migration", "mcp-server", "tools/mysql-to-sqlite"]

[dependencies]
rocket = { version = "0.5.0", features = ["secrets", "tls", "json"] }
sea-orm-rocket = "0.5.4"
serde = { version = "1.0", features = ["derive"] }
async-trait = { version = "0.1" }
sea-orm = { version = "0.12.15", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "with-uuid",
] }
migration = { path = "migration" }
entity = { path = "entity" }
jsonwebtoken = "9.3.0"
chrono = "0.4.38"
calamine = "0.25.0"
rocket_okapi = { version = "0.9.0", features = ["swagger", "rapidoc"] }
schemars = "0.8"
rand = "0.8.5"
reqwest = { version = "0.12.15", features = ["json"] }
rmcp = { version = "0.15", features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
scraper = "0.23.1"
openssl = { version = "0.10", features = ["vendored"] }
bcrypt = "0.17.0"
howtocook-mcp-server = { path = "mcp-server" }
thiserror = "1"
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["sync"] }
futures = "0.3"
tokio-stream = "0.1"
redis = "0.23"


[dependencies.uuid]
version = "1.8.0"
features = ["v7", "v4"]

[dependencies.sqlx]
version = "0.7"
default-features = false
features = ["macros", "migrate", "sqlite"]

[dependencies.rocket_db_pools]
version = "0.1.0"
features = ["deadpool_redis"]
