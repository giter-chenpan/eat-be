[package]
name = "howtocook-mcp-server"
version = "0.1.0"
edition = "2021"
description = "MCP Server for reading HowToCook (程序员做饭指南) cookbook repository"
authors = ["chenpan"]

[dependencies]
rust-mcp-sdk = { version = "0.2", features = ["server", "macros", "hyper-server"] }
rust-mcp-schema = "0.4"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"
thiserror = "2.0"
